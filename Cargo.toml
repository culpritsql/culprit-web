[package]
name = "culprit-web"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
chrono = { version = "0.4", default-features = false }
axum = "0.8"
culprit-archive-web = { path = "vendor/culprit/crates/culprit-archive-web" }
culprit-core = { path = "vendor/culprit/crates/culprit-core" }
culprit-engine = { path = "vendor/culprit/crates/culprit-engine", default-features = false }
culprit-read = { path = "vendor/culprit/crates/culprit-read" }
openidconnect = "4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
url = "2"

[dev-dependencies]
culprit-engine = { path = "vendor/culprit/crates/culprit-engine", default-features = false, features = ["collector"] }
async-trait = "0.1"
culprit-auth = { path = "vendor/culprit/crates/authentication/culprit-auth" }
culprit-blob-s3 = { path = "vendor/culprit/crates/recovery/culprit-blob-s3" }
culprit-checks = { path = "vendor/culprit/crates/culprit-checks" }
culprit-collector = { path = "vendor/culprit/crates/culprit-collector", features=["test-support"] }
culprit-evidence = { path = "vendor/culprit/crates/culprit-evidence", features=["test-support"] }
culprit-store-clickhouse = { path = "vendor/culprit/crates/telemetry/culprit-store-clickhouse", features=["write"] }
zeroize = "1"
tempfile = "3"

[profile.dev]
debug = 1
split-debuginfo = "off"

[[example]]
name = "publish-incident-fixture"
path = "tests/native/publish_incident.rs"
