name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: rustup update stable && rustup default stable
      - name: Render self-hosted chart
        run: |
          helm lint charts/culprit-fleet --set image=local/culprit-fleet:test --set config.existingConfigMap=workspace
          helm template checks charts/culprit-fleet --set image=local/culprit-fleet:test --set config.existingConfigMap=workspace --set ingress.enabled=true --set ingress.host=test.example > /dev/null
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - run: bun install --frozen-lockfile && bun run build
      - run: bunx playwright install --with-deps chromium --only-shell
      - run: bun run test:e2e
      - name: Read original incident evidence through ClickHouse and S3
        run: python3 -B tests/native/verify.py
