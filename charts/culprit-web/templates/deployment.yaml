apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "culprit-web.fullname" . }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "culprit-web.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "culprit-web.selector" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        checksum/config: {{ .Values.config.files | toJson | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      {{- with .Values.serviceAccountName }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "culprit-web.image" . | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          {{- with .Values.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.env }}
          env: {{ toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - {name: config, mountPath: /run/config, readOnly: true}
            - {name: state, mountPath: /var/lib/culprit-web}
            - {name: temp, mountPath: /tmp}
            {{- if .Values.existingSecret }}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "culprit-web.config" . }}
        - name: state
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: temp
          emptyDir: {}
        {{- if .Values.existingSecret }}
        - name: secrets
          secret:
            secretName: {{ .Values.existingSecret | quote }}
            defaultMode: 0440
        {{- end }}
